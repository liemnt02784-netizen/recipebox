<section class="page">
  <h1 class="page-title">{{ i18n.t('adminRecipes.pageTitle') }}</h1>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>{{ i18n.t('recipes.searchLabel') }}</mat-label>
    <input
      matInput
      type="search"
      [placeholder]="i18n.t('recipes.searchPlaceholder')"
      [ngModel]="searchInput()"
      (ngModelChange)="onSearchChange($event)"
    />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <div class="recipe-grid">
    @for (recipe of visibleRecipes(); track recipe.id) {
      <mat-card class="recipe-card-item" appearance="outlined">
        <img [src]="recipe.imgUrl" [alt]="'Ảnh của ' + recipe.name" class="recipe-thumb" />
        <mat-card-content class="recipe-card-body">
          <span class="recipe-card-name">{{ recipe.name }}</span>
          <div class="recipe-card-actions">
            <button matIconButton type="button" (click)="editRecipe(recipe.id)" [attr.aria-label]="i18n.t('recipes.editAria')">
              <mat-icon>edit</mat-icon>
            </button>
            <button matIconButton type="button" (click)="deleteRecipe(recipe.id, recipe.name)" [attr.aria-label]="i18n.t('recipes.deleteAria')">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-card-content>
      </mat-card>
    } @empty {
      <div class="empty-state">
        <span class="material-symbols-outlined empty-state-icon">restaurant</span>
        <p class="empty-title">{{ i18n.t('recipes.empty') }}</p>
        <a matButton="outlined" class="empty-state-cta" routerLink="/admin/recipes/new">
          <mat-icon>add</mat-icon>{{ i18n.t('recipes.addNew') }}
        </a>
      </div>
    }
  </div>

  <a matButton="filled" class="add-link" routerLink="/admin/recipes/new">
    <mat-icon>add</mat-icon>{{ i18n.t('recipes.addNew') }}
  </a>
</section>
