<div class="icon-badge">
  <mat-icon>report</mat-icon>
</div>
<h2 mat-dialog-title>{{ i18n.t('adminOrders.cancelDialogTitle') }}</h2>
<mat-dialog-content class="message">
  <p>{{ i18n.t('adminOrders.cancelDialogMessage') }}</p>
  <mat-form-field appearance="outline" class="reason-field">
    <mat-label>{{ i18n.t('adminOrders.cancelReasonLabel') }}</mat-label>
    <textarea matInput rows="3" [ngModel]="reason()" (ngModelChange)="reason.set($event)"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="cancel()">{{ i18n.t('common.cancel') }}</button>
  <button matButton="filled" class="confirm-btn" type="button" [disabled]="!reason().trim()" (click)="confirm()">
    {{ i18n.t('adminOrders.cancelConfirmAction') }}
  </button>
</mat-dialog-actions>
